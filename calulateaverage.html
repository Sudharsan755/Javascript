
<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Grade Analysis</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <header class="bg-primary text-white text-center p-4">
        <h1>Calculate average</h1>
        <p class="mb-0">Calculate your academic performance</p>
    </header>
    <main class="container mt-4">
        <div class="card shadow p-4">
            <h4 class="text-primary mb-3">Student Details</h4>
            <div class="mb-3">
                <label class="form-label">Name</label>
                <input type="text" id="name" class="form-control" placeholder="Enter student name">
            </div>
            <div class="mb-3">
                <label class="form-label">Register Number</label>
                <input type="text" id="Reg" class="form-control"placeholder="Enter register number">
            </div>
            <h4 class="text-primary mb-3">Subject Marks</h4>
            <div class="mb-3">
                <label class="form-label">Tamil</label>
                <input type="text" id="Tamil" class="form-control"maxlength="3" max="100">
            </div>
            <div class="mb-3">
                <label class="form-label">English</label>
                <input type="text" id="English" class="form-control"maxlength="3" max="100">
            </div>
            <div class="mb-3">
                <label class="form-label">Maths</label>
                <input type="text" id="Maths" class="form-control"maxlength="3" max="100">
            </div>
            <div class="mb-3">
                <label class="form-label">Science</label>
                <input type="text" id="Science" class="form-control"maxlength="3" max="100">
            </div>
            <div class="mb-3">
                <label class="form-label">Social</label>
                <input type="text" id="Social" class="form-control"maxlength="3" max="100">
            </div>
            <button type="button" class="btn btn-success"
                    onclick="average()">
                Calculate 
            </button>
            <div id="result" class="mt-4"></div>
        </div>
    </main>
    <script>
        function average() {
            let name=document.getElementById("name").value;
            let Reg=document.getElementById("Reg").value;
            let Tamil=Number(document.getElementById("Tamil").value);
            let English=Number(document.getElementById("English").value);
            let Maths=Number(document.getElementById("Maths").value);
            let Science=Number(document.getElementById("Science").value);
            let Social=Number(document.getElementById("Social").value);
            let marks=[Tamil, English, Maths, Science, Social];
            let total=0;
            for (let sum of marks) {
                total=total + sum;
            }
            let avg=(total / marks.length).toFixed(2);
            let status;
            if (marks.every(sum => sum >= 35)) {
                status="PASS";
            } else {
                status="FAIL";
            }
            document.getElementById("result").innerHTML =
                "<h4 class='text-primary'>Student Result</h4>" +
                "<p><b>Name:</b> " + name + "</p>" +
                "<p><b>Register Number:</b> " + Reg + "</p>" +
                "<p><b>Total Marks:</b> " + total + " / 500</p>" +
                "<p><b>Average:</b> " + avg + "</p>" +
                "<h5 class='text-success'>Result: " + status + "</h5>";
        }
    </script>
</body>
</html>
